[project]
name = "psei"
version = "0.2.0"
description = "Minimal Cambridge-style pseudocode interpreter"
readme = "README.md"
authors = [
    { name = "Luke Tang", email = "Luke.TangH@outlook.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "pseudocode",
  "interpreter",
  "education",
  "computer-science",
  "cambridge"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development :: Interpreters"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luke-tangh/psei"
Repository = "https://github.com/luke-tangh/psei"
Issues = "https://github.com/luke-tangh/psei/issues"

[project.scripts]
pseudo = "psei.cli:main"
psei = "psei.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "twine>=7.0.0",
]

[tool.coverage.run]
branch = true
source = ["psei"]

[tool.coverage.report]
fail_under = 80
show_missing = true
