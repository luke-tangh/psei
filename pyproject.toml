[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psei"
version = "0.1.2"
description = "Minimal Cambridge-style pseudocode interpreter"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Luke Tang" }
]
keywords = [
  "pseudocode",
  "interpreter",
  "education",
  "computer-science",
  "cambridge"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development :: Interpreters"
]

[project.urls]
Homepage = "https://github.com/luke-tangh/psei"
Repository = "https://github.com/luke-tangh/psei"
Issues = "https://github.com/luke-tangh/psei/issues"

[project.scripts]
pseudo = "psei.cli:main"
psei = "psei.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["psei*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
